# Wardseal Production Environment Values
# This file contains production-specific configuration with ALL best practices enabled

global:
  imageRegistry: ghcr.io/dhawalhost
  imagePullSecrets:
    - name: ghcr-pull-secret

# KMS Configuration - Use Vault in production
kms:
  provider: vault
  vaultSecretName: wardseal-vault-kms-production

# Database - Production
database:
  sslMode: require
  existingSecret: wardseal-db-credentials-production

# Service auth - Production (ESO: wardseal-service-auth-production)
serviceAuth:
  existingSecret: wardseal-service-auth-production
  tokenKey: token
  header: X-Service-Auth

# Migrations Job
migrations:
  enabled: true
  image: migrate/migrate:v4.18.2
  configMapName: wardseal-migrations
  backoffLimit: 3
  ttlSecondsAfterFinished: 600


# ====================
# Auth Service - Production
# ====================
authsvc:
  enabled: true
  serviceAuth:
    existingSecret: wardseal-service-auth-production
    tokenKey: token
    header: X-Service-Auth
  database:
    existingSecret: wardseal-db-credentials-production
    sslMode: require
  imagePullSecrets:
    - name: ghcr-pull-secret
  replicaCount: 3
  
  image:
    tag: ""  # Overridden by values-production-versions.yaml in Argo CD
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  
  env:
    ENVIRONMENT: production
    COOKIE_SECURE: "true"
    DB_SSLMODE: require
    SERVICE_AUTH_HEADER: X-Service-Auth
    AUTH_SERVICE_URL: https://auth.wardseal.com
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc:8081
    UI_URL: https://id.wardseal.com
    KMS_PROVIDER: vault
    LOG_LEVEL: warn
    REDIS_ENABLED: "true"
    REDIS_ADDR: redis-production.wardseal-production.svc.cluster.local:6379
    WEBAUTHN_SESSION_TTL_SECONDS: "600"
    RATE_LIMIT_USE_TENANT: "true"
    RATE_LIMIT_KEY_PREFIX: wardseal:ratelimit
    CORS_ALLOWED_ORIGINS: https://wardseal.com,https://manage.wardseal.com,https://id.wardseal.com,https://auth.wardseal.com

  envFrom:
    - secretRef:
        name: wardseal-vault-kms-production

  vaultAppRole:
    existingSecret: wardseal-vault-kms-production
  
  # Security contexts
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  
  # Health probes
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  
  startupProbe:
    httpGet:
      path: /health/startup
      port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
  
  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  # High availability
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  
  # Security
  networkPolicy:
    enabled: true
  
  # Monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  
  # Pod anti-affinity for better distribution
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: authsvc
            topologyKey: kubernetes.io/hostname


# ====================
# Ingress - Production
# ====================
adminui:
  enabled: true
  imagePullSecrets:
    - name: ghcr-pull-secret
  nginx:
    authServiceHost: wardseal-authsvc
    authServicePort: 8080
    directoryServiceHost: wardseal-dirsvc
    directoryServicePort: 8081
    governanceServiceHost: wardseal-govsvc
    governanceServicePort: 8082

idui:
  enabled: true
  imagePullSecrets:
    - name: ghcr-pull-secret
  nginx:
    authServiceHost: wardseal-authsvc
    authServicePort: 8080

landingui:
  enabled: true
  imagePullSecrets:
    - name: ghcr-pull-secret

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: auth.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: authsvc
          port: 8080
    - host: api.wardseal.com
      paths:
        - path: /api/v1/users
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/groups
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/oauth
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/governance
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/policy
          pathType: Prefix
          service: policysvc
          port: 8083
        - path: /api/v1/provisioning
          pathType: Prefix
          service: provsvc
          port: 8084
    - host: manage.wardseal.com
      paths:
        - path: /login/lookup
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /t/
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /oauth2
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /.well-known
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/user
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/mfa
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/users
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/groups
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/organizations
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/audit
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/sso
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/governance
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/policy
          pathType: Prefix
          service: policysvc
          port: 8083
        - path: /api/v1/provisioning
          pathType: Prefix
          service: provsvc
          port: 8084
        - path: /
          pathType: Prefix
          service: adminui
          port: 80
    - host: id.wardseal.com
      paths:
        - path: /login/lookup
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /t/
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /oauth2
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /.well-known
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /social/login
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /logout
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/signup
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/setup
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/mfa
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/user
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/devices
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /
          pathType: Prefix
          service: idui
          port: 80
    - host: wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: landingui
          port: 80
  tls:
    - secretName: wardseal-tls
      hosts:
        - auth.wardseal.com
        - api.wardseal.com
        - manage.wardseal.com
        - id.wardseal.com
        - wardseal.com

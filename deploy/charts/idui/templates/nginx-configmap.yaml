apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "idui.fullname" . }}-nginx
  labels:
    {{- include "idui.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Forward cookies to authsvc (required for session AuthGuard)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_cookie_flags ~ nosecure;

        location /t/ { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /oauth2/ { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /.well-known/ { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /social/login { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /login/lookup { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /saml/ { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /logout { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /api/v1/logout { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }

        location ~ ^/api/v1/(apps|api-keys|mfa|user|devices|branding|signup|setup|developer|signals|webauthn|logout) {
            proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }};
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
